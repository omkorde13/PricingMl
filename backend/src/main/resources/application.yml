spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pricing_db?TimeZone=UTC
    username: postgres
    password: om
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000

  threads:
    virtual:
      enabled: true

  security:
    filter:
      order: 10

ml:
  service:
    url: http://localhost:8000
    timeout: 5000

jwt:
  secret: your-256-bit-secret-key-replace-in-production-min-32-chars
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173

pricing:
  usd-to-inr: 92.88
  base-fare-usd: 8.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,cache
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.pricing.pricing_backend: DEBUG